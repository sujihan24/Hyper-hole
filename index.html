<style>
  /* cross-document view transition: fades this page's snapshot into the
     next page's on navigation, so the background color change (light
     here → #161617 on sub_1) reads as one smooth transition instead of
     an instant cut. sub_1.html needs the matching @view-transition rule
     too — both the departing and arriving document opt in. */
  @view-transition {
    navigation: auto;
  }

  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation-duration: 0.5s;
  }

  @font-face {
    font-family: 'SM3SSMyungJo';
    src: url('fonts/SM3SSMyungJo-04.otf') format('opentype');
    font-weight: 400;
    font-display: swap;
  }
  @font-face {
    font-family: 'Panama Monospace';
    src: url('fonts/PanamaMonospace-Regular.otf') format('opentype');
    font-weight: 400;
    font-display: swap;
  }

  :root{
    --bg:#F9F9FB;
    --paper:#1e1d21;
    /* paper is fixed at 360mm × 128mm (physical size on screen); paper is
       79% × 69.75% of the sheet, so the sheet itself works out to
       360/0.79 × 128/0.6975 mm to keep that same margin proportion */
    --sheet-w: 455.696;
    --sheet-h: 183.513;
    --font-en: 'Panama Monospace', 'JetBrains Mono', monospace;
    --font-kr: 'SM3SSMyungJo', 'Apple SD Gothic Neo', serif;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    min-height: 100%;
    background: var(--bg);
    font-family: var(--font-en);
  }

  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 6vh 4vw;
  }

  /* ---- the stage: fixed to the sheet's physical mm size (see
     --sheet-w/--sheet-h) so the paper renders at true 360mm × 128mm; the
     vw cap only kicks in if the viewport is too small to fit that ---- */
  .stage {
    position: relative;
    width: min(455.696mm, 96vw);
  }

  /* ---- the sheet: everything is laid out in % of this box,
     so it scales as one unit at any viewport size ---- */
  .sheet {
    position: relative;
    width: 100%;
    aspect-ratio: var(--sheet-w) / var(--sheet-h);
  }

  /* ---- subpo_test.jpg fills the whole viewport, not just the sheet —
     sized to .sheet it left a gap of body background color whenever the
     window was bigger than the paper; pinning it to the viewport with
     cover means it never runs out regardless of window size. .stage is
     already viewport-centered (see body's flex centering), so a plain
     centered cover on the full viewport lines up with the paper too. ---- */
  .rec-bg {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    pointer-events: none;
    user-select: none;
  }

  /* ---- the trimmed paper — centered in the sheet: (100-79)/2 = 10.5%
     left/right, (100-69.75)/2 = 15.125% top/bottom ---- */
  .paper {
    position: absolute;
    left: 10.5%;
    top: 15.125%;
    width: 79%;
    height: 69.75%;
    background: var(--paper);
    container-type: inline-size;
    overflow: hidden;
    box-shadow: inset 0 0 0.4cqw 0.4cqw rgba(0, 0, 0, 0.4);
  }

  /* aged-paper overlay — tex.jpg sits on top of the dark paper,
     screened in so its lighter grain/fiber/stains read as texture
     instead of just darkening the black */
  .texture {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    user-select: none;
    mix-blend-mode: screen;
    opacity: 0.17;
  }

  /* second texture pass, layered on top of .texture for extra grain/emphasis */
  .texture-2 {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    pointer-events: none;
    user-select: none;
    mix-blend-mode: overlay;
    opacity: 0.2;
  }

  /* ---- punched holes: CSS-drawn circle placeholder standing in for the
     hole_N.png cutouts until those are ready, label on top, linking
     straight into the next page — plain <a> navigation so there is no
     in-page loading step ---- */
  .hole {
    position: absolute;
    transform: translate(-50%, -50%);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 32% 28%, #ffffff 0%, #e2e2e2 55%, #c6c6c6 100%);
    box-shadow:
      inset -0.08cqw 0 0.1cqw rgba(0,0,0,0.15),
      inset 0.09cqw 0 0.1cqw rgba(0,0,0,0.35);
    text-decoration: none;
    -webkit-tap-highlight-color: transparent;
    transition: transform 0.35s ease, box-shadow 0.35s ease;
    cursor: pointer;
  }

  .hole span {
    position: relative;
    font-family: var(--font-kr);
    font-weight: 400;
    font-size: 14.4pt;
    color: #1a1a1a;
    user-select: none;
    line-height: 1;
  }

  .hole:hover,
  .hole:focus-visible {
    transform: translate(-50%, -50%) scale(1.08);
    box-shadow:
      inset -0.05cqw 0 0.02cqw rgba(255,255,255,0.95),
      inset 0.06cqw 0 0.02cqw rgba(0,0,0,0.35);
    outline: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .hole { transition: none !important; }
  }
</style>

<script>
  // intro + idle replay: every hole appears with a hard instant cut (no
  // scale/fade animation) at its own random moment, in random order, all
  // landing within a hard 2s budget. This is an exhibition kiosk piece, so
  // a visitor glancing over after it's settled shouldn't read the still
  // frame as frozen — if 3s pass with no interaction after a full reveal,
  // it replays, looping for as long as nobody touches it.
  (() => {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) return;

    const TOTAL_MS = 2000;
    const IDLE_MS = 3000;
    const holes = document.querySelectorAll('.hole');

    function punchHoles() {
      holes.forEach(hole => {
        const anim = hole.animate([
          { transform: 'translate(-50%, -50%) scale(0)', opacity: 0 },
          { transform: 'translate(-50%, -50%) scale(1)', opacity: 1 }
        ], {
          duration: 1,
          delay: Math.random() * TOTAL_MS,
          fill: 'both'
        });
        anim.onfinish = () => anim.cancel();
      });
    }

    let replayTimer = null;
    function armReplay() {
      clearTimeout(replayTimer);
      replayTimer = setTimeout(() => {
        punchHoles();
        armReplay();
      }, TOTAL_MS + IDLE_MS);
    }

    ['pointerdown', 'pointermove', 'keydown', 'wheel', 'touchstart'].forEach(evt =>
      window.addEventListener(evt, armReplay, { passive: true })
    );

    punchHoles();
    armReplay();
  })();
</script>
